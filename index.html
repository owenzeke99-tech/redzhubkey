<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redz Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --red:#ff1733;
    --red2:#ff4055;
    --red3:#9d0010;
    --white:#fff;
    --gray:#777780;
    --bg:#020203;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            #101012 0%,
            #050506 48%,
            #020203 100%
        );

    color:white;
    font-family:"Inter",sans-serif;
}


/* =====================================================
   ANIMATED BACKGROUND
===================================================== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}


/* Moving horizontal light */

.light-line{
    position:absolute;
    width:100%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,20,40,.35),
        transparent
    );

    filter:blur(.5px);

    animation:lineMove 7s linear infinite;
}

.light-line:nth-child(1){
    top:18%;
}

.light-line:nth-child(2){
    top:72%;
    animation-delay:-3s;
}

@keyframes lineMove{
    0%{
        transform:translateX(-100%);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        transform:translateX(100%);
        opacity:0;
    }
}


/* Moving grid */

.grid{
    position:absolute;

    width:180%;
    height:100%;

    left:-40%;

    opacity:.075;

    background-image:
        linear-gradient(
            rgba(255,255,255,.12) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.12) 1px,
            transparent 1px
        );

    background-size:60px 60px;

    transform:
        perspective(550px)
        rotateX(63deg)
        translateY(15%);

    animation:gridMove 12s linear infinite;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }

    to{
        background-position:0 60px;
    }
}


/* Tiny stars */

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#ff3349;

    box-shadow:
        0 0 5px #ff3349;

    animation:
        starFloat
        var(--duration)
        linear
        infinite;
}

@keyframes starFloat{

    0%{
        transform:
            translateY(110vh)
            scale(.3);

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    50%{
        transform:
            translateY(50vh)
            scale(1);
    }

    85%{
        opacity:.5;
    }

    100%{
        transform:
            translateY(-10vh)
            scale(.2);

        opacity:0;
    }
}


/* =====================================================
   WRAPPER
===================================================== */

.wrapper{
    width:92%;
    max-width:480px;

    position:relative;

    z-index:10;
}


/* =====================================================
   TOP MENU
===================================================== */

.nav{
    height:48px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    margin-bottom:12px;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius:14px;

    background:
        rgba(8,8,10,.72);

    backdrop-filter:blur(20px);

    animation:
        navEnter
        .8s
        cubic-bezier(.2,.8,.2,1)
        both;
}

@keyframes navEnter{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;

    font-family:"Orbitron",sans-serif;

    font-size:10px;
    font-weight:800;

    letter-spacing:1.5px;
}

.online{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff2038;

    box-shadow:
        0 0 5px #ff2038,
        0 0 14px #ff2038;

    animation:
        onlinePulse
        1.4s
        ease-in-out
        infinite;
}

@keyframes onlinePulse{

    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(.5);
        opacity:.45;
    }
}

.nav-right{
    color:#4f4f56;

    font-size:9px;
    font-weight:700;

    letter-spacing:1px;
}


/* =====================================================
   MAIN CARD
===================================================== */

.card{
    position:relative;

    padding:
        35px
        28px
        27px;

    overflow:hidden;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(17,17,20,.94),
            rgba(5,5,7,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    backdrop-filter:blur(25px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.75);

    animation:
        cardEnter
        .9s
        cubic-bezier(.2,.8,.2,1)
        both;
}

@keyframes cardEnter{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* Scan light */

.card .scan{
    position:absolute;

    left:0;

    width:100%;
    height:80px;

    top:-100px;

    background:
        linear-gradient(
            transparent,
            rgba(255,20,40,.06),
            transparent
        );

    pointer-events:none;

    animation:
        scan 6s
        ease-in-out
        infinite;
}

@keyframes scan{

    0%{
        top:-100px;
    }

    55%,100%{
        top:110%;
    }
}


/* Top red line */

.card::before{
    content:"";

    position:absolute;

    top:0;
    left:15%;

    width:70%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff2038,
            transparent
        );

    box-shadow:
        0 0 16px #ff2038;

    animation:
        topLine 3s
        ease-in-out
        infinite;
}

@keyframes topLine{

    0%,100%{
        opacity:.35;
        transform:scaleX(.6);
    }

    50%{
        opacity:1;
        transform:scaleX(1);
    }
}


/* =====================================================
   RZ LOGO
===================================================== */

.logo-area{
    width:125px;
    height:125px;

    margin:0 auto;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* Outer rotating diamond */

.logo-orbit{
    position:absolute;

    width:108px;
    height:108px;

    border-radius:29px;

    border:
        1px solid
        rgba(255,25,48,.35);

    transform:rotate(45deg);

    box-shadow:
        0 0 20px rgba(255,0,25,.08);

    animation:
        orbitRotate
        8s
        linear
        infinite;
}

.logo-orbit::before,
.logo-orbit::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff243c;

    box-shadow:
        0 0 10px #ff243c,
        0 0 20px #ff243c;
}

.logo-orbit::before{
    top:-4px;
    left:50%;
}

.logo-orbit::after{
    bottom:-4px;
    right:50%;
}

@keyframes orbitRotate{

    to{
        transform:rotate(405deg);
    }
}


/* Inner circle */

.logo-circle{
    position:absolute;

    width:91px;
    height:91px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,40,55,.3);

    animation:
        circlePulse
        3s
        ease-in-out
        infinite;
}

@keyframes circlePulse{

    0%,100%{
        transform:scale(1);
        opacity:.7;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}


/* Main logo */

.logo{
    width:78px;
    height:78px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:23px;

    font-family:"Orbitron",sans-serif;

    font-size:29px;
    font-weight:900;

    letter-spacing:-4px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #ff344b 0%,
            #e00017 42%,
            #72000a 100%
        );

    border:
        1px solid
        rgba(255,255,255,.25);

    box-shadow:
        0 0 25px rgba(255,0,25,.4),
        inset 0 1px 0 rgba(255,255,255,.3),
        inset 0 -12px 25px rgba(65,0,5,.5);

    transform:rotate(-3deg);

    overflow:hidden;

    animation:
        logoFloat
        3.5s
        ease-in-out
        infinite;
}


/* Logo shine */

.logo::before{
    content:"";

    position:absolute;

    width:30px;
    height:130px;

    left:-55px;
    top:-25px;

    background:
        linear-gradient(
            transparent,
            rgba(255,255,255,.5),
            transparent
        );

    transform:rotate(25deg);

    animation:
        logoShine
        3.8s
        ease-in-out
        infinite;
}

@keyframes logoShine{

    0%,35%{
        left:-55px;
    }

    70%,100%{
        left:105px;
    }
}


/* Logo scan */

.logo::after{
    content:"";

    position:absolute;

    left:8px;
    right:8px;

    height:1px;

    background:
        rgba(255,255,255,.4);

    box-shadow:
        0 0 7px rgba(255,255,255,.5);

    animation:
        logoScan
        2.5s
        ease-in-out
        infinite;
}

@keyframes logoScan{

    0%{
        top:12px;
        opacity:0;
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.7;
    }

    100%{
        top:65px;
        opacity:0;
    }
}

@keyframes logoFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(-3deg);
    }

    50%{
        transform:
            translateY(-5px)
            rotate(-3deg);
    }
}


/* =====================================================
   TITLE
===================================================== */

.title{
    margin-top:20px;

    text-align:center;

    font-family:"Orbitron",sans-serif;

    font-size:26px;
    font-weight:900;

    letter-spacing:-1px;

    background:
        linear-gradient(
            90deg,
            #fff 15%,
            #ff3047 45%,
            #fff 75%
        );

    background-size:220% auto;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        titleShine
        4s
        linear
        infinite;
}

@keyframes titleShine{

    to{
        background-position:220% center;
    }
}

.subtitle{
    margin-top:7px;

    text-align:center;

    color:#65656d;

    font-size:11px;
}


/* =====================================================
   MENU
===================================================== */

.menu{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:23px;
}

.menu-item{
    position:relative;

    padding:10px 4px;

    overflow:hidden;

    border-radius:11px;

    text-align:center;

    color:#686870;

    font-size:9px;
    font-weight:800;

    letter-spacing:.8px;

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,255,255,.055);

    cursor:pointer;

    transition:
        .3s
        cubic-bezier(.2,.8,.2,1);
}

.menu-item::before{
    content:"";

    position:absolute;

    left:-120%;
    top:0;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,30,50,.2),
            transparent
        );

    transition:.55s;
}

.menu-item:hover::before{
    left:120%;
}

.menu-item:hover{
    color:white;

    border-color:
        rgba(255,30,50,.35);

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 25px
        rgba(255,0,25,.08);
}

.menu-item.active{
    color:#ff4b5d;

    border-color:
        rgba(255,30,50,.25);

    background:
        rgba(255,20,35,.055);
}


/* =====================================================
   KEY
===================================================== */

.key-section{
    margin-top:23px;
}

.label{
    margin-bottom:8px;

    color:#777780;

    font-size:9px;
    font-weight:800;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.key-container{
    display:flex;
    align-items:center;

    gap:7px;

    padding:6px;

    border-radius:14px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    transition:.3s;
}

.key-container:hover{
    border-color:
        rgba(255,30,48,.3);

    box-shadow:
        0 0 25px
        rgba(255,0,25,.06);
}

.key{
    flex:1;

    padding:10px 8px;

    color:#ff6473;

    font-size:10px;
    font-weight:700;

    line-height:1.5;

    word-break:break-all;
}

.copy-btn{
    position:relative;

    min-width:78px;

    padding:12px;

    overflow:hidden;

    border:0;
    border-radius:10px;

    color:white;

    font-size:9px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #ff293f,
            #a90010
        );

    cursor:pointer;

    box-shadow:
        0 6px 20px
        rgba(255,0,25,.2);

    transition:.2s;
}

.copy-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-80px;

    width:40px;
    height:100%;

    background:
        rgba(255,255,255,.3);

    transform:skewX(-20deg);

    animation:
        buttonShine
        3s
        infinite;
}

@keyframes buttonShine{

    0%,55%{
        left:-80px;
    }

    80%,100%{
        left:130%;
    }
}

.copy-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 30px
        rgba(255,0,25,.35);
}

.copy-btn:active{
    transform:scale(.95);
}

.status{
    height:18px;

    margin-top:9px;

    text-align:center;

    color:#ff5364;

    font-size:10px;
    font-weight:600;
}


/* =====================================================
   INFO
===================================================== */

.info{
    margin-top:11px;

    padding:12px;

    border-radius:12px;

    background:
        rgba(255,255,255,.022);

    border:
        1px solid
        rgba(255,255,255,.045);

    color:#5f5f67;

    text-align:center;

    font-size:9px;

    line-height:1.6;
}

.info b{
    color:#9999a1;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    margin-top:19px;

    text-align:center;

    color:#38383e;

    font-size:8px;
    font-weight:700;

    letter-spacing:1.3px;
}

.footer span{
    color:#a20c1b;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .wrapper{
        width:94%;
    }

    .card{
        padding:
            31px
            18px
            24px;
    }

    .logo-area{
        width:110px;
        height:110px;
    }

    .logo-orbit{
        width:96px;
        height:96px;
    }

    .logo{
        width:72px;
        height:72px;
        font-size:26px;
    }

    .title{
        font-size:22px;
    }

    .key-container{
        flex-direction:column;
        align-items:stretch;
    }

    .copy-btn{
        width:100%;
    }
}
</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="grid"></div>

    <div class="light-line"></div>
    <div class="light-line"></div>


    <div class="star"
         style="left:5%;--duration:9s;animation-delay:1s">
    </div>

    <div class="star"
         style="left:13%;--duration:12s;animation-delay:3s">
    </div>

    <div class="star"
         style="left:22%;--duration:10s;animation-delay:5s">
    </div>

    <div class="star"
         style="left:31%;--duration:14s;animation-delay:2s">
    </div>

    <div class="star"
         style="left:43%;--duration:11s;animation-delay:6s">
    </div>

    <div class="star"
         style="left:56%;--duration:13s;animation-delay:1s">
    </div>

    <div class="star"
         style="left:68%;--duration:10s;animation-delay:4s">
    </div>

    <div class="star"
         style="left:79%;--duration:15s;animation-delay:7s">
    </div>

    <div class="star"
         style="left:91%;--duration:12s;animation-delay:3s">
    </div>

</div>



<div class="wrapper">


    <!-- NAV -->

    <div class="nav">

        <div class="brand">

            <div class="online"></div>

            REDZ HUB

        </div>

        <div class="nav-right">
            KEY SYSTEM
        </div>

    </div>



    <!-- CARD -->

    <div class="card">

        <div class="scan"></div>


        <!-- RZ LOGO -->

        <div class="logo-area">

            <div class="logo-orbit"></div>

            <div class="logo-circle"></div>

            <div class="logo">
                Rz
            </div>

        </div>


        <!-- TITLE -->

        <h1 class="title">
            Redz Hub Key
        </h1>

        <p class="subtitle">
            Secure access • Fast • Simple
        </p>


        <!-- MENU -->

        <div class="menu">

            <div class="menu-item active">
                KEY
            </div>

            <div class="menu-item">
                STATUS
            </div>

            <div class="menu-item">
                INFO
            </div>

        </div>


        <!-- KEY -->

        <div class="key-section">

            <div class="label">
                Your Access Key
            </div>

            <div class="key-container">

                <div class="key" id="key">
                    RedzHubKeyGuaie - Haowhdi7273Hsiwodjdi
                </div>

                <button
                    class="copy-btn"
                    id="copyBtn"
                    onclick="copyKey()">
                    COPY
                </button>

            </div>

            <div
                class="status"
                id="status">
            </div>

        </div>


        <!-- INFO -->

        <div class="info">

            Copy the key above and paste it into
            <b>Redz Hub</b>
            to continue.

        </div>


        <!-- FOOTER -->

        <div class="footer">
            REDZ HUB
            <span>•</span>
            KEY SYSTEM © 2026
        </div>

    </div>

</div>



<script>

/* ================================
   COPY KEY
================================ */

function copyKey(){

    const key =
        document
        .getElementById("key")
        .innerText
        .trim();

    const button =
        document
        .getElementById("copyBtn");

    const status =
        document
        .getElementById("status");


    navigator.clipboard
    .writeText(key)

    .then(()=>{

        button.innerText="COPIED ✓";

        status.innerText=
            "✓ Key copied successfully";

        setTimeout(()=>{

            button.innerText="COPY";

            status.innerText="";

        },2500);

    })

    .catch(()=>{

        status.innerText=
            "Please copy the key manually.";

    });

}


/* ================================
   MENU
================================ */

document
.querySelectorAll(".menu-item")
.forEach(item=>{

    item.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".menu-item")
            .forEach(el=>{
                el.classList.remove("active");
            });

            this.classList.add("active");

        }
    );

});


/* ================================
   MOUSE PARALLAX
================================ */

const card =
    document.querySelector(".card");

document.addEventListener(
    "mousemove",
    e=>{

        const x =
            (window.innerWidth / 2 - e.clientX)
            / 80;

        const y =
            (window.innerHeight / 2 - e.clientY)
            / 80;

        card.style.transform =
            `perspective(1000px)
             rotateX(${y}deg)
             rotateY(${-x}deg)`;

    }
);

document.addEventListener(
    "mouseleave",
    ()=>{

        card.style.transform =
            "perspective(1000px) rotateX(0) rotateY(0)";

    }
);

</script>

</body>
</html>
